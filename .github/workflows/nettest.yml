# Prueba de conexión por internet en Mac y Windows reales.
name: nettest
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  same-machine:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        nodirect: ["", "1"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Conexión (MJ_NODIRECT=${{ matrix.nodirect }})
        env:
          MJ_REAL: "1"
          MJ_NOSOUND: "1"
          MJ_LOG_STDOUT: "1"
          MJ_NODIRECT: ${{ matrix.nodirect }}
        shell: bash
        run: go test -run TestConexionReal -v -count=1 -timeout 5m . 2>&1 | tee out.txt; exit ${PIPESTATUS[0]}
      - name: Guardar registro
        if: always()
        shell: bash
        env:
          JOBTAG: "${{ matrix.os }}-${{ matrix.nodirect }}"
        run: |
          git config user.name ci && git config user.email ci@users.noreply.github.com
          B="logs/$JOBTAG"
          git checkout -q --orphan "$B" && git rm -rqf --cached . >/dev/null
          git add -f out.txt && git commit -qm "registro $JOBTAG" && git push -qf origin "HEAD:refs/heads/$B"
  cross-host:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Anfitrión en Mac
        env: { MJ_REAL: "1", MJ_NOSOUND: "1", MJ_LOG_STDOUT: "1", MJ_ROLE: host, MJ_ROOM: "Q${{ github.run_number }}" }
        shell: bash
        run: go test -run TestConexionReal -v -count=1 -timeout 5m . 2>&1 | tee out.txt; exit ${PIPESTATUS[0]}
      - name: Guardar registro
        if: always()
        shell: bash
        env:
          JOBTAG: "cross-host"
        run: |
          git config user.name ci && git config user.email ci@users.noreply.github.com
          B="logs/$JOBTAG"
          git checkout -q --orphan "$B" && git rm -rqf --cached . >/dev/null
          git add -f out.txt && git commit -qm "registro $JOBTAG" && git push -qf origin "HEAD:refs/heads/$B"
  cross-guest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Invitado en Windows
        env: { MJ_REAL: "1", MJ_NOSOUND: "1", MJ_LOG_STDOUT: "1", MJ_ROLE: guest, MJ_ROOM: "Q${{ github.run_number }}" }
        shell: bash
        run: go test -run TestConexionReal -v -count=1 -timeout 5m . 2>&1 | tee out.txt; exit ${PIPESTATUS[0]}
      - name: Guardar registro
        if: always()
        shell: bash
        env:
          JOBTAG: "cross-guest"
        run: |
          git config user.name ci && git config user.email ci@users.noreply.github.com
          B="logs/$JOBTAG"
          git checkout -q --orphan "$B" && git rm -rqf --cached . >/dev/null
          git add -f out.txt && git commit -qm "registro $JOBTAG" && git push -qf origin "HEAD:refs/heads/$B"

