name: probe
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Probar servidor
        env: { MJ_PROBE: "1", MJ_NOSOUND: "1", MJ_LOG_STDOUT: "1" }
        shell: bash
        run: go test -run TestSignalProbe -v -count=1 -timeout 3m . 2>&1 | tee out.txt; exit ${PIPESTATUS[0]}
      - name: Guardar registro
        if: always()
        shell: bash
        run: |
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git checkout -q --orphan logs/probe && git rm -rqf --cached . >/dev/null
          git add -f out.txt && git commit -qm "registro probe" && git push -qf origin HEAD:refs/heads/logs/probe
