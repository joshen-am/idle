name: turntest
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  turn:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Servidores TURN
        env: { MJ_TURN: "1", MJ_NOSOUND: "1" }
        shell: bash
        run: go test -run TestServidoresTURN -v -count=1 -timeout 5m . 2>&1 | tee out.txt; exit ${PIPESTATUS[0]}
      - name: Guardar registro
        if: always()
        shell: bash
        run: |
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git checkout -q --orphan logs/turn && git rm -rqf --cached . >/dev/null
          git add -f out.txt && git commit -qm "registro turn" && git push -qf origin HEAD:refs/heads/logs/turn
