# Fabrica las apps y publica una versión nueva (Actions > release > Run workflow).
# Las apps instaladas la encuentran solas al abrirse y se actualizan.
name: release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión (ej. 1.3.0)"
        required: true
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Fabricar apps
        run: ./build.sh "${{ inputs.version }}" "${{ github.repository }}"
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v${{ inputs.version }}" dist/Idle-Mac.zip dist/Idle-Windows.zip
          --target "${{ github.sha }}" --title "Idle v${{ inputs.version }}" --notes "Se instala sola al abrir la app."
